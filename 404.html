<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Page Not Found · Ali Raza Saleem</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2310141c'/%3E%3Cpath d='M22 22 L12 32 L22 42' stroke='%23e1a94c' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M42 22 L52 32 L42 42' stroke='%23e1a94c' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="canonical" href="https://alirazasaleem.github.io/">
<meta name="theme-color" content="#10141c">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg: #10141c;
    --surface: #171d28;
    --surface-2: #1d2433;
    --border: #2a3344;
    --border-soft: #232a39;
    --text: #e7e3d8;
    --text-muted: #8b93a7;
    --text-faint: #5c6478;
    --accent: #e1a94c;
    --accent-2: #5fb3b3;
    --font-display: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      linear-gradient(var(--border-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
    background-size: 42px 42px;
    color: var(--text);
    font-family: var(--font-display);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap{
    max-width: 560px;
    width: 100%;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 4px;
    padding: clamp(32px, 6vw, 52px);
    position: relative;
  }
  .wrap::before{
    content: "";
    position: absolute;
    top: -1px; left: -1px;
    width: 18px; height: 18px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .wrap::after{
    content: "";
    position: absolute;
    bottom: -1px; right: -1px;
    width: 18px; height: 18px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
    display: flex;
    align-items: center;
    gap: 0.6em;
  }
  .eyebrow::before{
    content: "";
    width: 22px;
    height: 1px;
    background: var(--accent);
  }
  h1{
    font-family: var(--font-mono);
    font-size: clamp(3rem, 12vw, 5.5rem);
    line-height: 1;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  h2{
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-weight: 600;
    margin: 0 0 14px;
  }
  p{
    color: var(--text-muted);
    margin: 0 0 28px;
    max-width: 44ch;
  }
  .actions{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn{
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--bg);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 11px 18px;
    text-decoration: none;
    font-weight: 600;
    transition: filter 0.15s ease;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn.ghost{
    color: var(--text);
    background: transparent;
    border-color: var(--border);
  }
  .btn.ghost:hover{ border-color: var(--accent-2); color: var(--accent-2); }
  .btn:focus-visible{
    outline: 2px solid var(--accent-2);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<main class="wrap" role="main">
  <div class="eyebrow">Error 404</div>
  <h1>404</h1>
  <h2>That route doesn't exist.</h2>
  <p>The page you were looking for either moved, was retired, or never existed. Head back to the main site — the signal path is intact.</p>
  <div class="actions">
    <a class="btn" href="/">← Back to home</a>
    <a class="btn ghost" href="mailto:alirazasaleem979111@gmail.com">Report broken link</a>
  </div>
</main>

</body>
</html>
